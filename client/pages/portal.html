<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Member Portal — VELOIRE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">

    <!-- Vite Core Scripts -->
    <script type="module" src="/js/api.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/ui.js"></script>
    <script type="module" src="/js/portal.js"></script>
</head>

<body class="page page-portal">
    <header class="header">
        <div class="header-inner container">
            <a href="/index.html" class="logo logo-gradient">VELOIRE</a>
            <div class="portal-member-badge">
                <span class="tiny muted uppercase tracking-widest">Member Status:</span>
                <span class="accent-pill">Vetted</span>
            </div>
        </div>
    </header>

    <main class="container portal-layout">
        <aside class="portal-sidebar">
            <nav class="portal-nav">
                <a href="#overview" class="portal-nav-item is-active">Overview</a>
                <a href="#collection" class="portal-nav-item">My Collection</a>
                <a href="#opportunities" class="portal-nav-item">Opportunities</a>
                <a href="#concierge" class="portal-nav-item">Concierge</a>
            </nav>
        </aside>

        <div class="portal-main">
            <section id="portal-overview">
                <p class="eyebrow">Welcome back</p>
                <h1>Collection Overview.</h1>

                <div class="grid grid-2 portal-stats" style="margin: 2rem 0;">
                    <div class="card-minimal">
                        <p class="tiny muted uppercase">Active Access</p>
                        <span class="stat-num">01</span>
                        <p class="tiny muted">Ferrari SF90 Stradale</p>
                    </div>
                    <div class="card-minimal">
                        <p class="tiny muted uppercase">Experience Points</p>
                        <span class="stat-num">1,250</span>
                        <p class="tiny muted">Elite Status</p>
                    </div>
                </div>

                <div class="section-header">
                    <h2>Recent Activity</h2>
                </div>
                <div class="card-minimal">
                    <p class="muted">Your application for the **SF90 Stradale** has been prioritized for weekend access.
                    </p>
                </div>
            </section>
        </div>
    </main>

    <style>
        .portal-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 4rem;
            padding-top: 4rem;
        }

        .portal-nav {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .portal-nav-item {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            text-decoration: none;
            transition: 0.3s;
        }

        .portal-nav-item:hover,
        .portal-nav-item.is-active {
            color: var(--accent);
        }

        .stat-num {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            display: block;
            margin: 0.5rem 0;
            color: var(--accent);
        }

        .accent-pill {
            background: var(--accent-soft);
            color: var(--accent);
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-left: 0.5rem;
        }
    </style>
</body>

</html>
