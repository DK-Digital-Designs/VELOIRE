<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Request Portal — VELOIRE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">

    <!-- Vite Core Scripts -->
    <script type="module" src="/js/api.js"></script>
    <script type="module" src="/js/ui.js"></script>
    <script type="module" src="/js/request.js"></script>
</head>

<body class="page">
    <header class="header">
        <div class="header-inner container">
            <a href="/index.html" class="logo logo-gradient">VELOIRE</a>
        </div>
    </header>

    <main id="rfa-main">
        <section class="section">
            <div class="container" style="max-width: 800px;">
                <div class="form-steps-header" style="margin-bottom: 4rem;">
                    <p class="eyebrow">Client Application</p>
                    <h1>Request Portal Access.</h1>
                    <div class="step-progress" style="display: flex; gap: 0.5rem; margin-top: 2rem;">
                        <span class="step-dot active"></span>
                        <span class="step-dot"></span>
                        <span class="step-dot"></span>
                    </div>
                </div>

                <form class="form card-premium" id="multi-step-rfa">
                    <!-- Step 1: Identification -->
                    <div class="form-step" data-step="1">
                        <h3>1. Identity</h3>
                        <div class="grid grid-2">
                            <div>
                                <label>Full Name</label>
                                <input type="text" name="clientName" required placeholder="John Doe">
                            </div>
                            <div>
                                <label>Email Address</label>
                                <input type="email" name="clientEmail" required placeholder="john@example.com">
                            </div>
                        </div>
                        <label>Contact Number</label>
                        <input type="tel" name="phone" required placeholder="+27 ...">
                        <button type="button" class="btn btn-primary next-step">Continue</button>
                    </div>

                    <!-- Step 2: Experience -->
                    <div class="form-step" data-step="2" style="display: none;">
                        <h3>2. Performance History</h3>
                        <label>Current/Previous High-Performance Vehicles</label>
                        <textarea name="experience" required
                            placeholder="Please list 2-3 significant cars you have experience with..."></textarea>
                        <div class="grid grid-2">
                            <button type="button" class="btn btn-ghost prev-step">Back</button>
                            <button type="button" class="btn btn-primary next-step">Continue</button>
                        </div>
                    </div>

                    <!-- Step 3: Intent -->
                    <div class="form-step" data-step="3" style="display: none;">
                        <h3>3. Intent</h3>
                        <label>Primary Use Case</label>
                        <select name="usage">
                            <option value="corporate">Corporate Event</option>
                            <option value="leisure">Weekend Leisure</option>
                            <option value="production">Media Production</option>
                            <option value="other">Other</option>
                        </select>
                        <label>Message/Notes</label>
                        <textarea name="usageDescription" required
                            placeholder="Any specific requirements..."></textarea>
                        <div class="grid grid-2">
                            <button type="button" class="btn btn-ghost prev-step">Back</button>
                            <button type="submit" class="btn btn-primary">Submit Application</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container" style="text-align: center;">
            <p class="tiny muted uppercase tracking-widest">&copy; 2026 VELOIRE — PRIVATE COLLECTION</p>
        </div>
    </footer>
</body>

</html>
