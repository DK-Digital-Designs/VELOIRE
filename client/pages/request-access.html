<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Request Access — VELOIRE Private Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">

    <!-- Vite Core Scripts -->
    <script type="module" src="../js/api.js"></script>
    <script type="module" src="../js/ui.js"></script>
    <script type="module" src="../js/request.js"></script>
</head>

<body class="page">
    <header class="header">
        <div class="header-inner container">
            <a href="../index.html" class="logo logo-gradient">VELOIRE</a>
        </div>
    </header>

    <main>
        <section class="section">
            <div class="container" style="max-width: 800px;">
                <div class="form-steps-header" style="margin-bottom: 4rem;">
                    <p class="eyebrow">Client Application</p>
                    <h1>Request Portal Access.</h1>
                    <div class="step-progress" style="display: flex; gap: 0.5rem; margin-top: 2rem;">
                        <span class="step-dot active"></span>
                        <span class="step-dot"></span>
                        <span class="step-dot"></span>
                    </div>
                </div>

                <div class="card-premium">
                    <form class="form" id="multi-step-rfa">
                        <!-- Step 1: Identity -->
                        <div class="form-step" data-step="1">
                            <h3>Step 1: Your Identity</h3>
                            <p class="muted tiny" style="margin-bottom: 2rem;">Legal identification is required for our
                                private vetting process.</p>
                            <label>Full Name</label>
                            <input type="text" name="clientName" required>

                            <label>Private Email</label>
                            <input type="email" name="clientEmail" required>

                            <label>Phone / WhatsApp</label>
                            <input type="tel" name="phone" required>

                            <div style="margin-top: 2rem;">
                                <button type="button" class="btn btn-primary btn-full next-step">Continue</button>
                            </div>
                        </div>

                        <!-- Step 2: Driving History -->
                        <div class="form-step" data-step="2" style="display: none;">
                            <h3>Step 2: Driving Profile</h3>
                            <p class="muted tiny" style="margin-bottom: 2rem;">Demonstrated experience with
                                high-performance machinery.</p>
                            <label>Experience with High-Performance Vehicles</label>
                            <textarea name="experience" rows="3"
                                placeholder="List models you have operated."></textarea>

                            <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                                <button type="button" class="btn btn-ghost prev-step">Back</button>
                                <button type="button" class="btn btn-primary btn-full next-step">Continue</button>
                            </div>
                        </div>

                        <!-- Step 3: Usage -->
                        <div class="form-step" data-step="3" style="display: none;">
                            <h3>Step 3: Usage Intent</h3>
                            <p class="muted tiny" style="margin-bottom: 2rem;">Tell us how you intend to use the
                                collection.</p>
                            <div class="grid-2 compact-grid"
                                style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                                <div>
                                    <label>Start Date</label>
                                    <input type="date" name="startDate">
                                </div>
                                <div>
                                    <label>End Date</label>
                                    <input type="date" name="endDate">
                                </div>
                            </div>
                            <label>Intended Usage</label>
                            <textarea name="usageDescription" rows="3"
                                placeholder="Business, leisure, or private display."></textarea>

                            <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                                <button type="button" class="btn btn-ghost prev-step">Back</button>
                                <button type="submit" class="btn btn-primary btn-full">Submit Application</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <style>
        .step-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }

        .step-dot.active {
            background: var(--accent);
        }
    </style>
</body>

</html>
