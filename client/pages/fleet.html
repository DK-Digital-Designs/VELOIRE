<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>The Fleet — VELOIRE Exclusive Collection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">

    <!-- Vite Core Scripts -->
    <script type="module" src="/js/api.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/ui.js"></script>
    <script type="module" src="/js/fleet.js"></script>
</head>

<body class="page">
    <header class="header">
        <div class="header-inner container">
            <a href="/index.html" class="logo logo-gradient">VELOIRE</a>
            <nav class="nav">
                <a href="/pages/fleet.html" class="is-active">Fleet</a>
                <a href="/pages/partnership.html">Partnership</a>
                <a href="/pages/about.html">About</a>
            </nav>
            <div class="header-cta">
                <a href="/pages/request-access.html" class="btn btn-primary btn-sm">Join Portal</a>
            </div>
        </div>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <p class="eyebrow">Curated Collection</p>
                <h1 class="section-title">The Veloire Fleet</h1>
                <p class="muted" style="max-width: 600px; margin-bottom: 4rem;">
                    A living collection of the world's finest machinery.
                    Defined by performance, presence, and provenance.
                </p>

                <!-- Minimalist Filters -->
                <div class="filter-bar" style="margin-bottom: 4rem; display: flex; gap: 2rem; align-items: center;">
                    <span class="tiny muted uppercase">Filter By:</span>
                    <button class="pill active" data-filter="all">All</button>
                    <button class="pill" data-filter="Supercar">Supercars</button>
                    <button class="pill" data-filter="SUV">Elite SUVs</button>
                </div>

                <div class="fleet-grid-mini" id="fleet-explorer-grid">
                    <!-- Populated by fleet.js -->
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <p class="logo logo-gradient">VELOIRE</p>
            <nav class="footer-nav">
                <a href="/admin/" class="tiny muted">Admin Portal</a>
                <span class="tiny muted uppercase tracking-widest">&copy; 2026 VELOIRE</span>
            </nav>
        </div>
    </footer>
</body>

</html>
