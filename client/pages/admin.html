<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Management — VELOIRE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">

    <!-- Vite Core Scripts -->
    <script type="module" src="/js/api.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/ui.js"></script>
    <script type="module" src="/js/admin.js"></script>
</head>

<body class="page page-admin">
    <header class="header header-admin">
        <div class="header-inner container">
            <a href="/index.html" class="logo logo-gradient">VELOIRE</a>
            <div class="header-admin-info">
                <span class="muted tiny uppercase tracking-widest" id="admin-user-info">Authenticating</span>
                <button class="btn btn-ghost btn-xs" id="logout-btn"
                    style="display: none; margin-left: 1rem; padding: 0.5rem 1rem;">Logout</button>
            </div>
        </div>
    </header>

    <div id="admin-login-overlay"
        style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; display: flex; align-items: center; justify-content: center;">
        <div class="card-premium" style="width: 400px;">
            <h3>Admin Access</h3>
            <form class="form" id="admin-login-form">
                <label>Identifier</label>
                <input type="email" name="email" required>
                <label>Security Code</label>
                <input type="password" name="password" required>
                <button type="submit" class="btn btn-primary btn-full">Authorize</button>
            </form>
        </div>
    </div>

    <div class="admin-shell container">
        <aside class="admin-sidebar" id="admin-sidebar" style="display: none;">
            <nav class="admin-nav" style="display: grid; gap: 1rem; padding: 4rem 0;">
                <button class="admin-nav-item is-active" data-admin-section="overview">Overview</button>
                <button class="admin-nav-item" data-admin-section="requests">Requests</button>
                <button class="admin-nav-item" data-admin-section="fleet">Fleet</button>
                <button class="admin-nav-item" data-admin-section="owners">Partners</button>
            </nav>
        </aside>

        <main class="admin-main" id="admin-main-content" style="display: none; padding: 4rem 0;">
            <section class="admin-section is-active" id="admin-overview">
                <p class="eyebrow">Real-Time Activity</p>
                <h1>Snapshot.</h1>
                <div class="grid grid-3 admin-metrics">
                    <div class="card-minimal">
                        <p class="tiny muted uppercase">Pending Requests</p>
                        <span class="stat-num" id="metric-pending">--</span>
                    </div>
                    <div class="card-minimal">
                        <p class="tiny muted uppercase">Approved Clients</p>
                        <span class="stat-num" id="metric-approved">--</span>
                    </div>
                    <div class="card-minimal">
                        <p class="tiny muted uppercase">Vehicles Live</p>
                        <span class="stat-num" id="metric-live">--</span>
                    </div>
                </div>
            </section>

            <section class="admin-section" id="admin-requests" style="display: none;">
                <h1>Requests for Access</h1>
                <div class="card-minimal">
                    <table class="admin-table" data-admin-requests>
                        <thead>
                            <tr>
                                <th>Client</th>
                                <th>Vehicle</th>
                                <th>Dates</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section class="admin-section" id="admin-fleet" style="display: none;">
                <h1>Fleet Management</h1>
                <div class="card-minimal">
                    <table class="admin-table" data-admin-fleet>
                        <thead>
                            <tr>
                                <th>Vehicle</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <style>
        .admin-nav-item {
            background: transparent;
            border: none;
            color: var(--text-muted);
            text-align: left;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: 0.3s;
        }

        .admin-nav-item.is-active {
            color: var(--accent);
            font-weight: 700;
        }

        .admin-nav-item:hover {
            color: #fff;
        }

        .status-pill {
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .status-pending {
            background: var(--surface-soft);
        }

        .status-approved,
        .status-live {
            background: var(--accent-soft);
            color: var(--accent);
        }
    </style>
</body>

</html>
