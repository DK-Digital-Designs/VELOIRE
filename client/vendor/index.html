<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vendor Portal — VELOIRE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">

    <!-- Vite Core Scripts -->
    <script type="module" src="/js/api.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/ui.js"></script>
    <script type="module" src="/vendor/vendor.js"></script>
</head>
<body class="page page-vendor">
    <header class="header">
        <div class="header-inner container">
            <a href="/index.html" class="logo logo-gradient">VELOIRE</a>
            <div class="portal-member-badge">
                <span class="tiny muted uppercase tracking-widest">Partner:</span>
                <span class="accent-pill">Verified Owner</span>
            </div>
        </div>
    </header>

    <main class="container portal-layout">
        <aside class="portal-sidebar">
            <nav class="portal-nav">
                <a href="#dashboard" class="portal-nav-item is-active">Partner Dashboard</a>
                <a href="#assets" class="portal-nav-item">My Assets</a>
                <a href="#earnings" class="portal-nav-item">Earnings</a>
                <a href="#support" class="portal-nav-item">Support</a>
            </nav>
        </aside>

        <div class="portal-main">
            <section id="vendor-overview">
                <p class="eyebrow">Inventory Status</p>
                <h1>Asset Performance.</h1>
                
                <div class="grid grid-3 portal-stats" style="margin: 2rem 0;">
                    <div class="card-minimal">
                        <p class="tiny muted uppercase">Active Listings</p>
                        <span class="stat-num">02</span>
                    </div>
                    <div class="card-minimal">
                        <p class="tiny muted uppercase">Total Yield</p>
                        <span class="stat-num">R45k</span>
                    </div>
                    <div class="card-minimal">
                        <p class="tiny muted uppercase">Utilization</p>
                        <span class="stat-num">78%</span>
                    </div>
                </div>

                <div class="section-header">
                    <h2>Live Assets</h2>
                </div>
                <div id="vendor-fleet-list">
                    <p class="muted">Loading your collection data...</p>
                </div>
            </section>
        </div>
    </main>

    <style>
        .portal-layout { display: grid; grid-template-columns: 250px 1fr; gap: 4rem; padding-top: 4rem; }
        .portal-nav { display: flex; flex-direction: column; gap: 1rem; }
        .portal-nav-item { 
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.2em; 
            color: var(--text-muted); text-decoration: none; transition: 0.3s;
        }
        .portal-nav-item:hover, .portal-nav-item.is-active { color: var(--accent); }
        .stat-num { font-family: 'Playfair Display', serif; font-size: 2.5rem; display: block; margin: 0.5rem 0; color: var(--accent); }
        .accent-pill { 
            background: var(--accent-soft); color: var(--accent); 
            padding: 0.3rem 0.8rem; border-radius: 50px; font-size: 0.6rem; 
            text-transform: uppercase; letter-spacing: 0.1em; margin-left: 0.5rem;
        }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; }
    </style>
</body>
</html>
